[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokyo-local-bus"
version = "0.1.0"
description = "東京都内の自治体・地域交通GTFSを取得、検証、GeoJSON化するMVP"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tokyo-local-bus = "tokyo_local_bus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
