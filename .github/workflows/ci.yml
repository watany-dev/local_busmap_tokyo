name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify repository prerequisites
        run: python tools/verify_repo.py
      - name: Validate feed catalog
        run: PYTHONPATH=src python -m tokyo_local_bus validate-config
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Offline end-to-end ingest (synthetic GTFS)
        run: |
          rm -rf data/sample-run
          PYTHONPATH=src python -m tokyo_local_bus ingest \
            --config tests/fixtures/test-feeds.json \
            --data-dir data/sample-run \
            --date 2026-08-22 \
            --local-zip TEST=tests/fixtures/minimal_gtfs.zip
      - name: Check offline API surface
        run: PYTHONPATH=src python tools/smoke_api.py --data-dir data/sample-run
